name: Feature request
description: Propose a focused addition.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the public API or behavior you want.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Partner API Client
        - Widget Helper
        - Astro Integration
        - Docs Playground
        - Repository tooling
