name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps or a small repository.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: "@coding-tree-io/boxnow"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, browser, Astro, runtime, and package versions.
